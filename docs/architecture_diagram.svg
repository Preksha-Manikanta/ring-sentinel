<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Inter, sans-serif">
  <rect width="900" height="620" fill="#070a0f"/>
  <text x="450" y="40" fill="#e6ebf2" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="4">RING SENTINEL — ARCHITECTURE</text>
  <text x="450" y="64" fill="#7c8798" font-size="12" text-anchor="middle">Deterministic detection · AI explains, never decides · mandatory human gate</text>

  <!-- boxes -->
  <g stroke="#29343f" fill="#0f141c">
    <rect x="330" y="90"  width="240" height="46" rx="6"/>
    <rect x="330" y="160" width="240" height="46" rx="6"/>
    <rect x="330" y="230" width="240" height="46" rx="6"/>
    <rect x="120" y="300" width="240" height="46" rx="6"/>
    <rect x="540" y="300" width="240" height="46" rx="6"/>
    <rect x="330" y="370" width="240" height="46" rx="6"/>
    <rect x="330" y="440" width="240" height="46" rx="6"/>
    <rect x="330" y="530" width="240" height="46" rx="6"/>
  </g>
  <g fill="#e6ebf2" font-size="13" text-anchor="middle">
    <text x="450" y="118">Synthetic dataset · 500 accts / 2000 orders</text>
    <text x="450" y="188">NetworkX relationship graph</text>
    <text x="450" y="258" fill="#35c7d6">Deterministic risk engine (NO LLM)</text>
    <text x="240" y="328">Holdout evaluation (20%)</text>
    <text x="660" y="322" fill="#b58bff">Claude narrator</text>
    <text x="660" y="338" font-size="10" fill="#7c8798">explanation only</text>
    <text x="450" y="398">FastAPI backend</text>
    <text x="450" y="462" fill="#f2c14e">Human analyst — WATCH / HOLD_PAYOUT / ESCALATE</text>
    <text x="450" y="558" fill="#3ecf8e">Hash-chained audit log</text>
  </g>

  <!-- arrows -->
  <g stroke="#56606f" stroke-width="1.6" marker-end="url(#a)">
    <line x1="450" y1="136" x2="450" y2="158"/>
    <line x1="450" y1="206" x2="450" y2="228"/>
    <line x1="400" y1="276" x2="260" y2="298"/>
    <line x1="500" y1="276" x2="620" y2="298"/>
    <line x1="620" y1="346" x2="500" y2="370"/>
    <line x1="450" y1="276" x2="450" y2="368"/>
    <line x1="450" y1="416" x2="450" y2="438"/>
    <line x1="450" y1="486" x2="450" y2="528"/>
  </g>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#56606f"/>
    </marker>
  </defs>

  <!-- guarantees -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="150" y="500" width="190" height="34" rx="6" fill="#1a0f12" stroke="#ff4d5e"/>
    <text x="245" y="522" fill="#ff4d5e">NO AUTO-BLOCK</text>
    <rect x="560" y="500" width="190" height="34" rx="6" fill="#120f1a" stroke="#b58bff"/>
    <text x="655" y="522" fill="#b58bff">LLM DOES NOT DECIDE</text>
  </g>
</svg>
